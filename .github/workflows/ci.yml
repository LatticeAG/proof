name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: npm ci
      - run: npm run build
      - run: npm run build:native
      - run: npm run lint
      - run: npm test
      - run: npm run conformance
      - run: npm run test:py
